name: Build libssh2 Universal macOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      OPENSSL_VERSION: "3.3.5"
      LIBSSH2_VERSION: "1.11.1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake ninja perl

      - name: Download Libssh2Prebuild
        run: |
          git clone https://github.com/DimaRU/Libssh2Prebuild.git
          cd Libssh2Prebuild
          git checkout master

      - name: Build universal libssh2
        run: |
          cd Libssh2Prebuild
          chmod +x script/*.sh
          # Set required environment variables for build-libssh2.sh
          export ROOT_PATH=$(pwd)
          export LIBSSH_SOURCE=$(pwd)/libssh2-${LIBSSH2_VERSION}
          export BUILT_PRODUCTS_DIR=$(pwd)/build/macos/universal
          export ARCHS="arm64 x86_64"
          export PLATFORM="MacOSX"
          export SDK_PLATFORM="macosx"
          export MIN_VERSION="12.0"
          export BUILD_THREADS=$(sysctl -n hw.ncpu)
          mkdir -p $BUILT_PRODUCTS_DIR
          # Run the build script
          script/build-libssh2.sh

      - name: Upload universal libssh2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libssh2-universal
          path: Libssh2Prebuild/build/macos/universal
