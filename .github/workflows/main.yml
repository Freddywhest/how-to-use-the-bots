name: Build libssh2 Universal macOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      OPENSSL_VERSION: "3.3.5"
      LIBSSH2_VERSION: "1.11.1"

    steps:
      # 1. Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Install required dependencies
      - name: Install dependencies
        run: |
          brew install cmake ninja perl

      # 3. Download Libssh2Prebuild repo
      - name: Download Libssh2Prebuild
        run: |
          git clone https://github.com/DimaRU/Libssh2Prebuild.git
          cd Libssh2Prebuild
          git checkout master

      # 4. Build libssh2 for macOS (universal: arm64 + x86_64)
      - name: Build universal libssh2
        working-directory: Libssh2Prebuild
        run: |
          chmod +x build-macos.sh
          ./build-macos.sh

      # 5. Upload universal libssh2 and headers as artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libssh2-universal
          path: Libssh2Prebuild/build/macos/universal
